	huynhtancuong/ADXL345@^1.0.2
	sv-zanshin/BME680@^1.0.12
	adafruit/Adafruit ADXL345@^1.3.4
	wollewald/ADXL345_WE@^3.1.0
	jgromes/RadioLib@^7.7.1
